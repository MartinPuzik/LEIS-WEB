<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEIS 3D Scene v0.1</title><style>body{margin:0;overflow:hidden;background:#030b18;color:#f6f8fa;font-family:Georgia,ui-serif,serif}canvas{display:block;width:100vw;height:100vh}.top{position:fixed;top:26px;left:28px}.top b{color:#d8ad4a}.eyebrow{font:11px ui-monospace,monospace;letter-spacing:.14em;color:#b7c0c9}.top h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.06em;line-height:.92;margin:10px 0}.info{position:fixed;right:28px;bottom:26px;width:min(330px,calc(100vw - 56px));color:#bac2cb;font:12px/1.6 ui-monospace,monospace;border-left:1px solid rgba(216,173,74,.55);padding-left:16px}.info strong{color:#f6f8fa;font-weight:500}.hint{position:fixed;left:28px;bottom:26px;color:#929da8;font:11px ui-monospace,monospace}@media(max-width:600px){.top{left:18px;top:18px}.info{right:18px;bottom:44px}.hint{left:18px;bottom:18px}}</style></head><body><canvas id="c"></canvas><div class="top"><div class="eyebrow"><b>Ω</b> LEIS / LINEAGE SCENE</div><h1>Reality<br>topology</h1></div><div class="info"><strong id="name">ORIENTATION / LEIS</strong><br><span id="desc">Understanding is reconstructed through relationships over time.</span></div><div class="hint">MOVE TO REORIENT FIELD · SELECT A SIGNAL</div><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),names=[['REALITY STREAM','A flow of observations, evidence, events and signals.'],['SIGNAL','An observable event which may carry meaning.'],['RECOGNITION PATTERN','A recurring way of noticing meaningful reality.'],['ACTIVATION','The moment understanding influences a decision.'],['LINEAGE','The history of how understanding evolves over time.']];let W,H,mouse=0,sel=-1;function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',size);size();c.onmousemove=e=>mouse=(e.clientX/innerWidth-.5)*1.3;c.onclick=e=>{let mx=e.clientX,my=e.clientY,best=-1,dist=99;nodes.forEach((n,i)=>{let p=pos(i,performance.now()/1000);let d=Math.hypot(p[0]-mx,p[1]-my);if(d<dist){dist=d;best=i}});if(dist<70){sel=best;name.textContent=names[best][0];desc.textContent=names[best][1]}};let nodes=names.map((_,i)=>i);function pos(i,t){let a=i/5*Math.PI*2+t*.17+mouse;let R=Math.min(innerWidth,innerHeight)*.29;return [innerWidth/2+Math.cos(a)*R,innerHeight/2+Math.sin(a)*R*.43,Math.sin(a)]}function dot(px,py,r,col){x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=col;x.fill()}function draw(t){t/=1000;x.clearRect(0,0,innerWidth,innerHeight);let g=x.createRadialGradient(innerWidth/2,innerHeight/2,0,innerWidth/2,innerHeight/2,innerWidth*.6);g.addColorStop(0,'#15395f');g.addColorStop(.45,'#081c36');g.addColorStop(1,'#030b18');x.fillStyle=g;x.fillRect(0,0,innerWidth,innerHeight);for(let i=0;i<90;i++){let a=i*2.4+t*.02,r=80+(i*71%Math.min(innerWidth,innerHeight)*.75);dot(innerWidth/2+Math.cos(a)*r,innerHeight/2+Math.sin(a)*r*.38,1,'rgba(216,173,74,.30)')}let ps=nodes.map(i=>pos(i,t));x.lineWidth=1;for(let i=0;i<5;i++){let q=ps[(i+1)%5],p=ps[i];x.strokeStyle='rgba(216,173,74,.32)';x.beginPath();x.moveTo(p[0],p[1]);x.lineTo(q[0],q[1]);x.stroke()}let pulse=17+Math.sin(t*2)*3;x.shadowBlur=35;x.shadowColor='#d8ad4a';dot(innerWidth/2,innerHeight/2,pulse,'#d8ad4a');dot(innerWidth/2,innerHeight/2,7,'#f6f8fa');x.shadowBlur=0;x.fillStyle='#f6f8fa';x.font='11px ui-monospace,monospace';x.textAlign='center';x.fillText('Ω  LEIS ORIENTATION',innerWidth/2,innerHeight/2+44);ps.forEach((p,i)=>{let r=10+p[2]*3;if(i===sel){x.shadowBlur=25;x.shadowColor='#f2d687'}dot(p[0],p[1],r,i===sel?'#f2d687':'#d8ad4a');x.shadowBlur=0;x.fillStyle='#e4e8eb';x.font='11px ui-monospace,monospace';x.fillText(names[i][0],p[0],p[1]-22)});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
