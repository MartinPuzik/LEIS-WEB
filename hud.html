<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEIS HUD v0.1</title><style>
:root{--gold:#d8ad4a;--ok:#f2d687;--deep:#081c36;--ink:#f6f8fa;--muted:#a4b0bd;--line:rgba(216,173,74,.28)}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#030b18;color:var(--ink);font-family:Georgia,ui-serif,serif}canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.94}.interface{position:relative;z-index:1;min-height:100vh;padding:28px;pointer-events:none}.top,.bottom{display:flex;justify-content:space-between;gap:24px}.brand{font:600 12px ui-monospace,monospace;letter-spacing:.16em}.brand b{color:var(--gold)}.stamp{color:var(--muted);font:11px ui-monospace,monospace}.status{margin-top:clamp(42px,10vh,100px);width:min(320px,45vw);padding:18px;background:rgba(8,28,54,.7);border:1px solid var(--line);backdrop-filter:blur(12px)}.label{font:11px ui-monospace,monospace;letter-spacing:.12em;color:var(--muted)}.status h1{font-size:clamp(28px,4vw,45px);letter-spacing:-.06em;line-height:1;margin:8px 0 22px}.rows{display:grid;gap:12px}.row{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;font:12px ui-monospace,monospace}.ready{color:var(--ok)}.bottom{position:absolute;bottom:26px;left:28px;right:28px;align-items:end}.lineage{max-width:720px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.node{font:11px ui-monospace,monospace;color:#c3cbd2}.node.active{color:var(--gold)}.arrow{color:var(--gold)}button{pointer-events:auto;background:rgba(8,28,54,.75);color:var(--gold);border:1px solid var(--line);padding:10px 13px;font:11px ui-monospace,monospace;cursor:pointer}@media(max-width:600px){.interface{padding:17px}.bottom{left:17px;right:17px;bottom:17px}.status{width:100%;margin-top:48px}.stamp{display:none}}
</style></head><body><canvas id="gl"></canvas><div class="interface"><div class="top"><div class="brand"><b>Ω</b> LEIS / RECOGNITION HUD</div><div class="stamp">REALITY-ORIENTED / LIVING SYSTEM</div></div><section class="status"><div class="label">CURRENT ACTIVATION</div><h1 id="state">RECOGNITION<br>ACTIVE</h1><div class="rows"><div class="row"><span>CORE</span><span class="ready">○ PRESENT</span></div><div class="row"><span>LINEAGE</span><span class="ready">○ CONNECTED</span></div><div class="row"><span>VALIDATION</span><span class="ready">○ OPEN</span></div><div class="row"><span>RENDER</span><span id="render">○ READY</span></div></div></section><div class="bottom"><div class="lineage"><span class="node active">01 SIGNAL</span><span class="arrow">→</span><span class="node">02 PATTERN</span><span class="arrow">→</span><span class="node">03 UNDERSTANDING</span><span class="arrow">→</span><span class="node">04 ACTIVATION</span><span class="arrow">→</span><span class="node">05 VALIDATION</span></div><button id="pulse">ACTIVATE RECOGNITION</button></div></div><script>
const c=document.querySelector('#gl'),gl=c.getContext('webgl');let p=0,boost=0;const vert=`attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`,frag=`precision mediump float;uniform vec2 r;uniform float t;uniform float b;void main(){vec2 u=(gl_FragCoord.xy*2.-r)/min(r.x,r.y);float d=length(u);float a=atan(u.y,u.x);float rings=smoothstep(.018,0.,abs(fract(d*5.-t*.34)-.5)-.10);float core=smoothstep(.20+sin(t*2.)*.018+b*.06,.0,d);float halo=smoothstep(.78,0.,d)*.12;float rays=pow(abs(sin(a*8.+t*.4)),20.)*smoothstep(.9,.15,d)*.22;vec3 col=vec3(.012,.035,.075)+vec3(.035,.14,.27)*halo+vec3(.85,.62,.18)*(rings*.35+core*.72+rays);col+=vec3(.95,.96,.90)*core*.22;gl_FragColor=vec4(col,1.);}`;function sh(x,y){let s=gl.createShader(x);gl.shaderSource(s,y);gl.compileShader(s);return s}let pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vert));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,frag));gl.linkProgram(pr);gl.useProgram(pr);let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);let a=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);let R=gl.getUniformLocation(pr,'r'),T=gl.getUniformLocation(pr,'t'),B=gl.getUniformLocation(pr,'b');function draw(x){let d=devicePixelRatio;c.width=innerWidth*d;c.height=innerHeight*d;gl.viewport(0,0,c.width,c.height);gl.uniform2f(R,c.width,c.height);gl.uniform1f(T,x*.001);gl.uniform1f(B,boost);boost*=.965;gl.drawArrays(gl.TRIANGLES,0,3);requestAnimationFrame(draw)}requestAnimationFrame(draw);pulse.onclick=()=>{boost=1;document.querySelector('#render').textContent='○ ACTIVATING';setTimeout(()=>document.querySelector('#render').textContent='○ READY',900)};
</script></body></html>
